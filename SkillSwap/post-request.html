<html>

    <title>Post Request</title>

<body>

    <h1>Post a Learning Request</h1>

    <form> <!--so this is here where user type inputs -->

        <label>Skill Needed:</label><br> <!--label for like describing the input-->
        <input type="text" placeholder="Enter skill"><br><br>

        <label>Description:</label><br>
        <textarea placeholder="Describe your request"></textarea><br><br>

        <label>Level:</label><br>
        <select> <!--dropdown menu-->
            <option>Beginner</option>
            <option>Intermediate</option>
            <option>Advanced</option>
        </select><br><br>

        <label>Preferred Time:</label><br>
        <input type="date"><br><br>

        <button type="submit">Post Request</button> <!--this is a button to send the form-->

    </form>

</body>
